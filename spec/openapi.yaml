openapi: 3.0.3
info:
  title: Genesis Core Standard (GCS) API
  version: "0.1.0"
servers:
  - url: http://localhost:8000
paths:
  /healthz:
    get:
      responses:
        "200":
          description: OK
  /version:
    get:
      responses:
        "200":
          description: Version
  /store:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, subject_id, type, content]
              properties:
                tenant_id: { type: string }
                subject_id: { type: string }
                type: { type: string }
                tags:
                  type: array
                  items: { type: string }
                content: { type: object }
                consent_ref: { type: string, nullable: true }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
  /recall:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id: { type: string }
                subject_id: { type: string }
                type: { type: string }
                tags: { type: array, items: { type: string } }
                q: { type: string }
                limit: { type: integer, default: 20 }
                semantic: { type: boolean, default: false }
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemoryRecord'
  /forget:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
      responses:
        "200":
          description: Forgotten
  /consent:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRecord'
      responses:
        "200":
          description: Upserted
  /export:
    post:
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id: { type: string }
                subject_id: { type: string }
      responses:
        "200":
          description: NDJSON stream
          content:
            application/x-ndjson:
              schema:
                type: string
components:
  schemas:
    MemoryRecord:
      $ref: './jsonschema/memory_record.schema.json'
    ConsentRecord:
      $ref: './jsonschema/consent_record.schema.json'
    AuditEvent:
      $ref: './jsonschema/audit_event.schema.json'
